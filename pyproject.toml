[project]
name = "job-fit-daily"
version = "1.0.0"
description = "A transparent daily job aggregation, ranking, dashboard, and email pipeline."
requires-python = ">=3.11"
authors = [{name = "Michael Crombie"}]
dependencies = []

[project.scripts]
jobfit = "jobfit.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobfit"]
